<div class="relative">
  <!-- Bell button -->
  <button (click)="toggleDropdown()" class="relative p-2 rounded-full hover:bg-blue-50 transition">
    <!-- Bell icon -->
    <span class="text-xl text-blue-600">🔔</span>

    <!-- Badge count -->
    <span *ngIf="notifications.length > 0"
          class="absolute -top-1 -right-1 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold text-white bg-red-600 rounded-full shadow">
      {{ notifications.length }}
    </span>
  </button>

  <!-- Dropdown -->
  <div *ngIf="dropdownOpen"
       class="absolute right-0 mt-2 w-72 bg-white border border-gray-200 rounded-lg shadow-xl z-50">
    <div class="px-4 py-2 border-b text-sm font-semibold text-gray-700 bg-gray-50 rounded-t-lg">
      Notifications
    </div>
    <ul class="max-h-64 overflow-y-auto">
      <li *ngFor="let n of notifications"
          class="px-4 py-3 text-sm text-gray-800 hover:bg-gray-100 transition border-b">
        {{ n.title || 'New notification' }}
      </li>
    </ul>
    <div *ngIf="notifications.length === 0"
         class="px-4 py-3 text-sm text-gray-500 text-center">
      No new notifications
    </div>
  </div>
</div>
