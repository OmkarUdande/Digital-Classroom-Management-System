<!-- Fullscreen Background Wrapper -->
<div class="w-full h-screen bg-cover bg-center bg-no-repeat relative"
  style="background-image: url('assets/images/student-login-bg.jpg');">

  <!-- Dark Overlay -->
  <div class="absolute inset-0 bg-black bg-opacity-50"></div>

  <!-- Centered Login Card -->
  <div class="relative z-10 flex items-center justify-center h-full px-4">
    <div
      class="w-full max-w-lg bg-white bg-opacity-10 backdrop-blur-xl border border-white border-opacity-30 shadow-2xl rounded-2xl p-10">

      <!-- Branding -->
      <h2
        class="text-5xl font-bold text-center bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 bg-clip-text text-transparent mb-4">
        Login
      </h2>
      <p class="text-gray-200 mb-8 text-center text-lg">Welcome to DCMS</p>

      <!-- Form -->
      <form class="space-y-5" (ngSubmit)="onLogin()">
        <input [(ngModel)]="email" name="email" type="email" placeholder="Email"
          class="w-full px-5 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-lg" />
        <input [(ngModel)]="password" name="password" type="password" placeholder="Password"
          class="w-full px-5 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-lg" />

        <!-- Optional: Default extra field -->
        <input [(ngModel)]="extraField" name="identifier" placeholder="User ID / Class / Subject"
          class="w-full px-5 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-lg" />

        <button type="submit" class="w-full bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 
               text-gray-900 py-3 rounded-lg shadow hover:opacity-90 transition text-lg">
          Login
        </button>
      </form>
    </div>
  </div>
</div>
