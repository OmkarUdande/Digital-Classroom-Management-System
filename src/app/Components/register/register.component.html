<!-- Fullscreen Background Wrapper -->
<div class="w-full h-screen bg-cover bg-center bg-no-repeat relative"
     style="background-image: url('assets/images/student-login-bg.jpg');">
  
  <!-- Dark Overlay -->
  <div class="absolute inset-0 bg-black bg-opacity-50"></div>

  <!-- Centered Register Card -->
  <div class="relative z-10 flex items-center justify-center h-full px-4">
    <div
      class="w-full max-w-lg bg-white bg-opacity-10 backdrop-blur-xl border border-white border-opacity-30 shadow-2xl rounded-2xl p-10">

      <!-- Branding -->
      <h2
        class="text-5xl font-bold text-center bg-gradient-to-r from-green-400 via-emerald-400 to-teal-400 bg-clip-text text-transparent mb-4">
        Register
      </h2>
      <p class="text-gray-200 mb-8 text-center text-lg">Create your DigitalClassroom account</p>

      <!-- Registration Form -->
      <form class="space-y-6" (ngSubmit)="onRegister()">
        <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Full Name"
               class="w-full px-5 py-3 border rounded-lg focus:ring-2 focus:ring-green-300 text-lg bg-white bg-opacity-80" />

        <input type="email" [(ngModel)]="email" name="email" placeholder="Email"
               class="w-full px-5 py-3 border rounded-lg focus:ring-2 focus:ring-green-300 text-lg bg-white bg-opacity-80" />

        <input type="password" [(ngModel)]="password" name="password" placeholder="Password"
               class="w-full px-5 py-3 border rounded-lg focus:ring-2 focus:ring-green-300 text-lg bg-white bg-opacity-80" />

        <input [(ngModel)]="extraField" name="identifier" placeholder="User ID / Class / Subject"
               class="w-full px-5 py-3 border rounded-lg focus:ring-2 focus:ring-green-300 text-lg bg-white bg-opacity-80" />

        <!-- Submit -->
        <button type="submit"
                class="w-full bg-gradient-to-r from-green-300 via-emerald-300 to-teal-300 text-gray-900 py-3 rounded-lg shadow hover:opacity-90 transition text-lg">
          Register
        </button>
      </form>

      <!-- Back to Login Button -->
      <div class="mt-6 text-center">
        <button routerLink="/login"
                class="px-5 py-2 bg-white bg-opacity-30 text-white rounded-lg hover:bg-opacity-50 transition">
          ⬅️ Back to Login
        </button>
      </div>

    </div>
  </div>
</div>
